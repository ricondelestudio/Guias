<head>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --text:#22252b; --muted:#6b7079; --line:#e6e2d8;
    --accent:#2f6fd6; --accent-2:#1f55b0; --accent-ink:#ffffff; --wa:#1fa855;
    --lenguaje:#e0576b; --matematicas:#2f6fd6; --ciencias:#2e9e6a; --historia:#c98a1b; --ingles:#8a5cd1; --otros:#6b7079;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;line-height:1.45}
  button{font:inherit}

  /* ---------- Encabezado con dibujos ---------- */
  header{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);padding:26px 16px 78px;position:relative;overflow:hidden}
  .wrap{max-width:1040px;margin:0 auto;position:relative;z-index:1}
  .brand{display:flex;align-items:center;gap:14px;max-width:560px}
  .logo{width:72px;height:72px;flex-shrink:0;filter:drop-shadow(0 4px 10px rgba(0,0,0,.2))}
  header h1{margin:0;font-size:clamp(28px,5vw,40px);font-weight:900;letter-spacing:-.01em}
  header p{margin:2px 0 0;opacity:.92}
  .doodles{position:absolute;right:0;top:0;height:100%;width:min(560px,60%);pointer-events:none}
  .doodles .f{animation:flota 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .doodles .f2{animation-duration:6.5s;animation-delay:-2s}
  .doodles .f3{animation-duration:4.2s;animation-delay:-1s}
  .doodles .gira{animation:gira 14s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes flota{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(4deg)}}
  @keyframes gira{to{transform:rotate(360deg)}}
  .ola{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:34px;display:block}
  @media (prefers-reduced-motion:reduce){ .doodles *{animation:none!important} }
  @media (max-width:640px){ .doodles{width:100%;opacity:.35} }

  /* ---------- Cursos ---------- */
  .panel{max-width:1040px;margin:-54px auto 0;padding:0 16px;position:relative;z-index:2}
  .cursos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--card);border-radius:18px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
  .curso{border:0;background:transparent;color:var(--text);font-weight:900;font-size:18px;padding:12px 6px;border-radius:14px;cursor:pointer;line-height:1.1}
  .curso small{display:block;font-weight:600;font-size:12px;color:var(--muted);margin-top:3px}
  .curso[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(47,111,214,.35)}
  .curso[aria-pressed="true"] small{color:rgba(255,255,255,.85)}

  /* ---------- Asignaturas ---------- */
  h2{font-size:21px;margin:28px 2px 12px;font-weight:900}
  .materias{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .materia{--c:var(--otros);text-align:left;border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:18px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .15s, box-shadow .15s}
  .materia:hover{transform:translateY(-3px) rotate(-1deg);box-shadow:0 8px 18px rgba(0,0,0,.07)}
  .materia .ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);margin-bottom:4px}
  .materia .ico svg{width:40px;height:40px}
  .materia b{font-size:16px}
  .materia span{color:var(--muted);font-size:13px}
  .materia[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,var(--card))}
  @media (max-width:760px){ .materias{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:480px){ .materias{grid-template-columns:repeat(2,1fr)} }

  /* ---------- Galería de guías ---------- */
  .tools{display:flex;gap:10px;align-items:center;margin:26px 0 12px;flex-wrap:wrap}
  .tools h2{margin:0;flex:1;min-width:200px}
  .search{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 12px;flex:1;min-width:200px;max-width:340px}
  .search input{border:0;outline:0;font:inherit;font-size:16px;width:100%;background:transparent;color:var(--text)}
  .galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding-bottom:40px}
  .tarjeta{--c:var(--otros);background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(0,0,0,.04);transition:transform .15s, box-shadow .15s}
  .tarjeta:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.09)}
  .portada{position:relative;aspect-ratio:4/3;background:#fff;border:0;padding:0;cursor:pointer;display:grid;place-items:center;overflow:hidden;border-bottom:4px solid var(--c)}
  .portada canvas,.portada img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
  .portada .ph{font-size:44px;opacity:.5}
  .portada .lupa{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px;opacity:0;transition:opacity .15s}
  .portada:hover .lupa,.portada:focus-visible .lupa{opacity:1}
  .portada .lupa svg{width:15px;height:15px}
  .cinta{position:absolute;left:10px;top:10px;background:var(--c);color:#fff;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.15);z-index:1}
  .cuerpo{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
  .cuerpo h3{margin:0;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
  .cuerpo .date{color:var(--muted);font-size:13px;margin-top:2px}
  .acciones{display:flex;gap:8px;margin-top:auto}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--c);color:#fff;text-decoration:none;font-weight:800;padding:10px 12px;border-radius:12px;font-size:15px;border:0;cursor:pointer;min-height:44px}
  .btn svg{width:19px;height:19px;flex-shrink:0}
  .btn.prim{flex:1}
  .btn.sec{background:transparent;color:var(--c);border:2px solid var(--c);width:44px;padding:0}
  .btn.wa{background:var(--wa);width:44px;padding:0}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 16px;background:var(--card);border:2px dashed var(--line);border-radius:18px}
  .empty svg{width:110px;height:auto;display:block;margin:0 auto 6px}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 30px}

  /* ---------- Visor ---------- */
  dialog#visor{width:min(980px,calc(100% - 24px));height:min(94vh,calc(100% - 24px));max-width:none;max-height:none;margin:auto;padding:0;border:0;border-radius:18px;background:var(--bg);color:var(--text);overflow:hidden}
  dialog#visor::backdrop{background:rgba(15,18,25,.7)}
  .vbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);--c:var(--accent)}
  .vbar .vt{flex:1;min-width:0}
  .vbar .vt b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vbar .vt span{font-size:12px;color:var(--muted)}
  .vbar .btn.prim{flex:0 0 auto;padding:10px 16px}
  .cerrar{background:transparent;border:2px solid var(--line);color:var(--text);width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:20px;line-height:1}
  .vpags{height:calc(100% - 65px);overflow:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px;background:#d9dce2}
  .vpags canvas,.vpags img{width:100%;max-width:900px;height:auto;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.15);border-radius:4px}
  .vmsg{color:#444;font-weight:700;padding:30px}
  @media (max-width:640px){
    dialog#visor{width:100%;height:100%;border-radius:0}
    .vpags{padding:8px;gap:8px}
    .vbar .btn.prim span{display:none}
    .vbar .btn.prim{flex:0 0 44px;padding:0}
  }

  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){--bg:#16181c;--card:#1f2228;--text:#eceef1;--muted:#9aa0aa;--line:#2c3038;--accent:#2a5fb8;--accent-2:#1b4790}
  }
  :root[data-theme="dark"]{--bg:#16181c;--card:#1f2228;--text:#eceef1;--muted:#9aa0aa;--line:#2c3038;--accent:#2a5fb8;--accent-2:#1b4790}
</style>
</head>

const SVG = {

const EJEMPLO = [

// ---------- PDF (pdf.js) ----------
let pdfLib = null; const docs = {};
function cargarPdfJs(){
  if (!pdfLib) pdfLib = new Promise((ok, falla) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; ok(pdfjsLib); };
    s.onerror = falla; document.head.appendChild(s);
  });
  return pdfLib;
}
function abrirPdf(src){ return docs[src] ||= cargarPdfJs().then(lib => lib.getDocument(src).promise); }
async function dibujar(pdf, n, anchoCss){
  const pag = await pdf.getPage(n);
  const base = pag.getViewport({scale:1});
  const vp = pag.getViewport({scale: anchoCss * Math.min(devicePixelRatio||1, 2) / base.width});
  const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
  await pag.render({canvasContext:c.getContext("2d"), viewport:vp}).promise;
  return c;
}
async function portada(el){
  const src = el.dataset.src;
  if (IMG.test(src)) { el.insertAdjacentHTML("afterbegin", `<img src="${src}" alt="" loading="lazy">`); el.querySelector(".ph")?.remove(); return; }
  if (!/\.pdf$/i.test(src)) return;
  try { const c = await dibujar(await abrirPdf(src), 1, el.clientWidth || 300); el.querySelector(".ph")?.remove(); el.prepend(c); } catch(e) {}
}
const vigia = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { vigia.unobserve(e.target); portada(e.target); } }), {rootMargin:"300px"});

// ---------- Compartir ----------
const linkGuia = g => `${location.origin}${location.pathname}?g=${encodeURIComponent(g.archivo)}`;
const linkWa = g => "https://wa.me/?text=" + encodeURIComponent(`📚 Guía de ${g.asig} (${g.curso}): ${g.titulo}\n${linkGuia(g)}`);

// ---------- Estado y pintado ----------
let guias = [], curso = CURSOS[0], materia = null;
try { const s = localStorage.getItem("curso"); if (CURSOS.includes(s)) curso = s; } catch(e){}

function pintarCursos(){
  document.getElementById("cursos").innerHTML = CURSOS.map(c => {
    const [num, nivel] = c.split(" ");
    return `<button class="curso" aria-pressed="${c===curso}" data-c="${c}">${num}<small>${nivel}</small></button>`;
  }).join("");
}
function pintarMaterias(){
  document.getElementById("tituloMaterias").textContent = `Asignaturas de ${curso}`;
  document.getElementById("materias").innerHTML = MATERIAS.map(m => {
    const n = guias.filter(g => g.curso===curso && g.asig===m.n).length;
    return `<button class="materia" style="--c:var(${m.c})" aria-pressed="${materia===m.n}" data-m="${m.n}">
      <div class="ico">${m.i}</div><b>${m.n}</b><span>${n} guía${n===1?"":"s"}</span></button>`;
  }).join("");
}
const vacio = `<div class="empty"><svg viewBox="0 0 120 80" aria-hidden="true"><path d="M20 22c13-5 26-5 40 3v44c-14-8-27-8-40-3z" fill="#fff" stroke="#9aa0aa" stroke-width="3" stroke-linejoin="round"/><path d="M100 22c-13-5-26-5-40 3v44c14-8 27-8 40-3z" fill="#fff" stroke="#9aa0aa" stroke-width="3" stroke-linejoin="round"/><path d="M88 8l3 7 7 .7-5.3 4.8 1.5 7-6.2-3.6-6.2 3.6 1.5-7-5.3-4.8 7-.7z" fill="#ffd54a"/></svg>Todavía no hay guías aquí. ¡Pronto se subirán!</div>`;

function pintarLista(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  document.getElementById("tituloLista").textContent = materia ? `Guías de ${materia}` : `Todas las guías de ${curso}`;
  const res = guias.filter(g => g.curso===curso && (!materia || g.asig===materia) && (g.titulo+" "+g.asig).toLowerCase().includes(q))
                   .sort((a,b)=>b.fecha.localeCompare(a.fecha) || a.titulo.localeCompare(b.titulo));
  document.getElementById("list").innerHTML = res.length ? res.map(g => {
    const i = guias.indexOf(g), ver = VISIBLE.test(g.archivo);
    return `<article class="tarjeta" style="--c:var(${mat(g.asig).c})">
      <button class="portada" ${ver?`data-ver="${i}"`:"disabled"} data-src="${esc(g.archivo)}" aria-label="Ver ${esc(g.titulo)}">
        <span class="cinta">${esc(g.asig)}</span><span class="ph">📄</span>
        ${ver?`<span class="lupa">${I.ojo} Ver guía</span>`:""}
      </button>
      <div class="cuerpo">
        <div><h3>${esc(g.titulo)}</h3>${g.fecha?`<div class="date">${fmt(g.fecha)}</div>`:""}</div>
        <div class="acciones">
          <a class="btn prim" href="${esc(g.archivo)}" download>${I.bajar}<span>Descargar</span></a>
          ${ver?`<button class="btn sec" data-ver="${i}" aria-label="Ver ${esc(g.titulo)}">${I.ojo}</button>`:""}
          <a class="btn wa" href="${linkWa(g)}" target="_blank" rel="noopener" aria-label="Compartir por WhatsApp">${I.wa}</a>
        </div>
      </div>
    </article>`;
  }).join("") : vacio;
  document.querySelectorAll(".portada[data-src]").forEach(el => vigia.observe(el));
}
function pintar(){ pintarCursos(); pintarMaterias(); pintarLista(); }

// ---------- Visor ----------
const visor = document.getElementById("visor");
let turnoVisor = 0;
async function abrirVisor(g){
  const t = ++turnoVisor;
  document.getElementById("vbar").style.setProperty("--c", `var(${mat(g.asig).c})`);
  document.getElementById("vTitulo").textContent = g.titulo;
  document.getElementById("vSub").textContent = `${g.asig} · ${g.curso}${g.fecha ? " · " + fmt(g.fecha) : ""}`;
  const d = document.getElementById("vDesc"); d.href = g.archivo; d.innerHTML = `${I.bajar}<span>Descargar</span>`;
  const w = document.getElementById("vWa"); w.href = linkWa(g); w.innerHTML = I.wa;
  const caja = document.getElementById("vPags");
  caja.innerHTML = `<div class="vmsg">Cargando guía…</div>`; caja.scrollTop = 0;
  if (!visor.open) visor.showModal();
  if (IMG.test(g.archivo)) { caja.innerHTML = `<img src="${g.archivo}" alt="${esc(g.titulo)}">`; return; }
  try {
    const pdf = await abrirPdf(g.archivo);
    const ancho = Math.min(caja.clientWidth - 32, 900);
    for (let n = 1; n <= pdf.numPages; n++) {
      const c = await dibujar(pdf, n, ancho);
      if (t !== turnoVisor || !visor.open) return;
      if (n === 1) caja.innerHTML = "";
      caja.appendChild(c);
    }
  } catch(e) {
    if (t === turnoVisor) caja.innerHTML = `<div class="vmsg">No se pudo mostrar la guía aquí. Usa el botón Descargar.</div>`;
  }
}
function cerrarVisor(){ turnoVisor++; visor.close(); }
document.getElementById("vCerrar").addEventListener("click", cerrarVisor);
visor.addEventListener("click", e => { if (e.target === visor) cerrarVisor(); });
visor.addEventListener("close", () => { turnoVisor++; document.getElementById("vPags").innerHTML = ""; });

// ---------- Eventos ----------
document.getElementById("cursos").addEventListener("click", e => {
  const b = e.target.closest(".curso"); if(!b) return;
  curso = b.dataset.c; materia = null;
  try { localStorage.setItem("curso", curso); } catch(e){}
  pintar();
});
document.getElementById("materias").addEventListener("click", e => {
  const b = e.target.closest(".materia"); if(!b) return;
  materia = materia===b.dataset.m ? null : b.dataset.m;
  pintarMaterias(); pintarLista();
  document.getElementById("tituloLista").scrollIntoView({behavior:"smooth", block:"start"});
});
document.getElementById("list").addEventListener("click", e => {
  const b = e.target.closest("[data-ver]"); if(!b) return;
  abrirVisor(guias[+b.dataset.ver]);
});
document.getElementById("q").addEventListener("input", pintarLista);

// ---------- Lectura de las guías desde las carpetas de GitHub ----------
// Carpetas: guias/<curso>/<asignatura>/<archivo>
const CARPETA_CURSO = {"1-basico":"1° Básico","2-basico":"2° Básico","3-basico":"3° Básico","4-basico":"4° Básico"};
const CARPETA_MATERIA = {"lenguaje":"Lenguaje","matematicas":"Matemáticas","ciencias":"Ciencias","historia":"Historia","ingles":"Inglés"};
const EXT = /\.(pdf|docx?|pptx?|xlsx?|jpe?g|png)$/i;

function desdeRutas(rutas){
  return rutas.map(ruta => {
    const p = ruta.split("/");
    if (p.length !== 4 || p[0] !== "guias" || !EXT.test(p[3])) return null;
    const curso = CARPETA_CURSO[p[1].toLowerCase()], asig = CARPETA_MATERIA[p[2].toLowerCase()];
    if (!curso || !asig) return null;
    let nombre = p[3].replace(EXT, ""), fecha = "";
    const m = nombre.match(/^(\d{4}-\d{2}-\d{2})[\s_-]*(.*)$/);
    if (m) { fecha = m[1]; nombre = m[2] || nombre; }
    nombre = nombre.replace(/[_]+/g, " ").trim();
    return {curso, asig, titulo: nombre, fecha, archivo: ruta.split("/").map(encodeURIComponent).join("/")};
  }).filter(Boolean);
}

async function cargarGuias(){
  const h = location.hostname;
  if (!h.endsWith(".github.io")) return fetch("guias.json").then(r=>r.ok?r.json():Promise.reject()).catch(()=>EJEMPLO);
  const usuario = h.replace(".github.io","");
  const repo = location.pathname.split("/").filter(Boolean)[0] || h;
  for (const rama of ["main","master"]) {
    const r = await fetch(`https://api.github.com/repos/${usuario}/${repo}/git/trees/${rama}?recursive=1`);
    if (r.ok) { const d = await r.json(); return desdeRutas(d.tree.filter(t=>t.type==="blob").map(t=>t.path)); }
  }
  throw new Error("sin acceso");
}

cargarGuias().then(d => {
  guias = d;
  // Link compartido: ?g=ruta → abre esa guía directo
  const pedida = new URLSearchParams(location.search).get("g");
  const g = pedida && guias.find(x => x.archivo === pedida);
  if (g) { curso = g.curso; materia = g.asig; }
  pintar();
  if (g && VISIBLE.test(g.archivo)) abrirVisor(g);
}).catch(() => {
  guias = []; pintar();
  document.getElementById("list").innerHTML = `<div class="empty">No pudimos cargar las guías. Intenta de nuevo en unos minutos.</div>`;
});
</script>
